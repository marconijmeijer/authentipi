{% extends "settings_layout.html" %}
{% block settings_content %}
  <h2>Content-marking badge</h2>
  <p>Bepaal hoe de Content Credentials-badge op gemarkeerde afbeeldingen eruitziet.</p>
  <form method="post" action="/settings/marker">
    <label class="field-row">
      Icoon
      <input type="text" name="icon" value="{{ marker.icon }}" maxlength="4" size="4" id="marker-icon" />
    </label>
    <label class="field-row">
      Tekst
      <input type="text" name="text" value="{{ marker.text }}" maxlength="60" id="marker-text" />
    </label>
    <label class="field-row">
      Tekstkleur
      <input type="color" name="text_color" value="{{ marker.text_color }}" id="marker-text-color" />
    </label>
    <label class="field-row">
      Achtergrondkleur
      <input type="color" name="bg_color" value="{{ marker.bg_color }}" id="marker-bg-color" />
    </label>

    <div class="preview-area"><p class="eyebrow">Voorbeeld van je badge</p>
    <div id="marker-preview" class="marker-preview"></div></div>

    <button type="submit">Opslaan</button>
  </form>

  <script>
    (function () {
      var icon = document.getElementById("marker-icon");
      var text = document.getElementById("marker-text");
      var textColor = document.getElementById("marker-text-color");
      var bgColor = document.getElementById("marker-bg-color");
      var preview = document.getElementById("marker-preview");

      function render() {
        preview.textContent = (icon.value ? icon.value + " " : "") + text.value;
        preview.style.color = textColor.value;
        preview.style.background = bgColor.value;
      }

      [icon, text, textColor, bgColor].forEach(function (el) {
        el.addEventListener("input", render);
      });
      render();
    })();
  </script>
{% endblock %}
