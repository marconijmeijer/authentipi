services:
  dns:
    build: ./dns
    container_name: authentipi-dns
    restart: unless-stopped
    ports:
      # Alleen nodig als je AuthentiPi als netwerk-brede DNS-resolver wilt
      # gebruiken. Voor lokaal testen (dashboard bekijken) is dit niet vereist.
      # Kan conflicteren met een lokale resolver op je host; pas zo nodig aan
      # naar bv. "5353:53/udp".
      - "53:53/udp"
      - "53:53/tcp"
    volumes:
      - dnsmasq-logs:/var/log/dnsmasq

  app:
    build: ./app
    container_name: authentipi-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      AUTHENTIPI_RULES_DIR: /rules
      AUTHENTIPI_DNS_LOG: /var/log/dnsmasq/dnsmasq.log
      AUTHENTIPI_DB_PATH: /data/authentipi.db
    volumes:
      - dnsmasq-logs:/var/log/dnsmasq:ro
      - ./rules:/rules:ro
      - app-data:/data
      - ./proxy/config.yaml:/tls-seed.yaml:ro
    depends_on:
      - dns

  proxy:
    build: ./proxy
    container_name: authentipi-proxy
    restart: unless-stopped
    command:
      - mitmdump
      - --mode
      - regular
      - --listen-port
      - "8081"
      - --set
      - confdir=/home/mitmproxy/.mitmproxy
      - -s
      - /addons/authentipi_addon.py
      - -s
      - /addons/tls_manager.py
    ports:
      - "8081:8081"
    environment:
      # Hoe de proxy-container zelf de 'app'-service bereikt, zowel om
      # detecties te rapporteren als om marker.js/de API same-origin
      # (via /__authentipi/...) naar clientapparaten door te proxyen. Altijd
      # het interne docker-netwerkadres -- clients hebben dit adres zelf
      # nooit nodig, dus geen LAN-IP-configuratie meer vereist.
      AUTHENTIPI_INTERNAL_APP_URL: http://app:8080
    volumes:
      # mitmproxy genereert hier bij eerste start zijn CA-certificaat
      # (mitmproxy-ca-cert.pem), dat je op clientapparaten moet vertrouwen.
      # Let op: de image draait de mitmproxy-tools als user 'mitmproxy' met
      # HOME=/home/mitmproxy (niet /root).
      - mitmproxy-ca:/home/mitmproxy/.mitmproxy
      - ./proxy/config.yaml:/home/mitmproxy/.mitmproxy/config.yaml:ro
    depends_on:
      - app

  classifier:
    build: ./classifier
    container_name: authentipi-classifier
    restart: unless-stopped
    # Fase 3, experimenteel en zwaar (torch + transformers, ~1-1.5GB image,
    # trage cold start). Draait niet standaard mee met `docker compose up`;
    # start 'm expliciet met `docker compose --profile experimental up -d`.
    # Zet ook de toggle op de instellingenpagina aan, anders roept de proxy
    # 'm nooit aan.
    profiles: ["experimental"]
    ports:
      - "8082:8082"

volumes:
  dnsmasq-logs:
  app-data:
  mitmproxy-ca:
