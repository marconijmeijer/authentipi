services:
  dns:
    build: ./dns
    container_name: authentipi-dns
    restart: unless-stopped
    ports:
      # Alleen nodig als je AuthentiPi als netwerk-brede DNS-resolver wilt
      # gebruiken. Voor lokaal testen (dashboard bekijken) is dit niet vereist.
      # Kan conflicteren met een lokale resolver op je host; pas zo nodig aan
      # naar bv. "5353:53/udp".
      - "53:53/udp"
      - "53:53/tcp"
    volumes:
      - dnsmasq-logs:/var/log/dnsmasq

  app:
    build: ./app
    container_name: authentipi-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      AUTHENTIPI_RULES_DIR: /rules
      AUTHENTIPI_DNS_LOG: /var/log/dnsmasq/dnsmasq.log
      AUTHENTIPI_DB_PATH: /data/authentipi.db
    volumes:
      - dnsmasq-logs:/var/log/dnsmasq:ro
      - ./rules:/rules:ro
      - app-data:/data
    depends_on:
      - dns

  proxy:
    build: ./proxy
    container_name: authentipi-proxy
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      # Intern: hoe de proxy-container zelf de 'app'-service bereikt om
      # detecties te rapporteren (via het docker-netwerk, altijd correct).
      AUTHENTIPI_INTERNAL_APP_URL: http://app:8080
      # Publiek: het adres waarop CLIENT-apparaten de 'app'-service kunnen
      # bereiken over het netwerk (dus je LAN-IP, niet 'localhost' -- tenzij
      # je alleen vanaf deze machine zelf test). Gebruikt in de <script>-tag
      # die in pagina's wordt geïnjecteerd. Overschrijf via een .env-bestand
      # (AUTHENTIPI_APP_BASE_URL=http://<jouw-lan-ip>:8080) -- zie
      # "Content-marking testen" in README.md en .env.example.
      AUTHENTIPI_APP_BASE_URL: ${AUTHENTIPI_APP_BASE_URL:-http://localhost:8080}
    volumes:
      # mitmproxy genereert hier bij eerste start zijn CA-certificaat
      # (mitmproxy-ca-cert.pem), dat je op clientapparaten moet vertrouwen.
      # Let op: de image draait de mitmproxy-tools als user 'mitmproxy' met
      # HOME=/home/mitmproxy (niet /root).
      - mitmproxy-ca:/home/mitmproxy/.mitmproxy
    depends_on:
      - app

volumes:
  dnsmasq-logs:
  app-data:
  mitmproxy-ca:
