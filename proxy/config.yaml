# TLS-bypass: stuur deze verbindingen versleuteld door, zonder inspectie.
# Exacte host:poort-regexen; geen URL-paden of algemene apple.com-wildcard.
# App Store-proef: deze hosts gaven TLS-handshakefouten in de lokale logs.
# Eenmalige import als groep Apple; beheer daarna via /settings/tls.
# Ook opstartfallback wanneer de backend en de laatst opgeslagen cache ontbreken.
# Bij een bestaande installatie overschrijft de database deze regels automatisch.
ignore_hosts:
  - '^init\.itunes\.apple\.com:443$'
  - '^bag\.itunes\.apple\.com:443$'
  - '^pd\.itunes\.apple\.com:443$'
  - '^apps\.mzstatic\.com:443$'
  - '^is1-ssl\.mzstatic\.com:443$'
  - '^amp-api-edge\.apps\.apple\.com:443$'
  - '^amp-api-search-edge\.apps\.apple\.com:443$'
  - '^search\.itunes\.apple\.com:443$'
  - '^gsa-gpk\.apple\.com:443$'
