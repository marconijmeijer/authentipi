# AuthentiPi dnsmasq config.
# Forwarder + query logger. Geen ad-blocking hier — dat is niet het doel van
# AuthentiPi; we loggen alleen wat er wordt opgevraagd zodat de app-service
# dat kan matchen tegen de AI-domeinlijsten.

# Upstream resolvers (pas aan naar wens, bijv. je eigen router of 1.1.1.1)
server=1.1.1.1
server=9.9.9.9

# Log elke DNS-query, inclusief de client die 'm stelde.
log-queries
log-facility=/var/log/dnsmasq/dnsmasq.log

# Geen DHCP — AuthentiPi is puur een DNS-resolver, DHCP blijft bij je router.
no-dhcp-interface=*

# Luister op alle interfaces binnen de container.
listen-address=0.0.0.0
bind-interfaces

# Cache wat groter dan de dnsmasq-default voor een thuisnetwerk.
cache-size=1000
